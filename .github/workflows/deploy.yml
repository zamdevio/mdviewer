name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-web:
    name: Pages (markview)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @mdviewer/web build
        env:
          # Required repo Variables — empty = share UI shows "Share off" / CORS issues in prod
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_FRONTEND_URL: ${{ vars.VITE_FRONTEND_URL }}

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy dist --project-name=markview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Custom hostname can retain pre-Vite HTML (e.g. /settings) under long s-maxage
      - name: Purge custom-domain HTML cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          ZONE_ID="${CF_ZONE_ID:-}"
          if [ -z "$ZONE_ID" ]; then
            ZONE_ID=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones?name=zamdev.dev" \
              | python3 -c 'import sys,json; r=json.load(sys.stdin); print((r.get("result") or [{}])[0].get("id",""))')
          fi
          if [ -z "$ZONE_ID" ]; then
            echo "No zamdev.dev zone id; skip purge"
            exit 0
          fi
          BODY=$(python3 - <<'PY'
          import json
          files=[
            "https://mdviewer.zamdev.dev/",
            "https://mdviewer.zamdev.dev/index.html",
            "https://mdviewer.zamdev.dev/settings",
            "https://mdviewer.zamdev.dev/settings/",
            "https://mdviewer.zamdev.dev/editor",
            "https://mdviewer.zamdev.dev/files",
            "https://mdviewer.zamdev.dev/search",
            "https://mdviewer.zamdev.dev/shares",
            "https://mdviewer.zamdev.dev/share",
          ]
          print(json.dumps({"files": files}))
          PY
          )
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$BODY" | python3 -c 'import sys,json; r=json.load(sys.stdin); print(r); raise SystemExit(0 if r.get("success") else 1)'

  deploy-worker:
    name: Worker (api)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
