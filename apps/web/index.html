    <meta name="apple-mobile-web-app-title" content="MDViewer" />
    <meta name="robots" content="index,follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = "light";
          try {
            var settings = localStorage.getItem("mdviewer_settings");
            if (settings) {
              var parsed = JSON.parse(settings);
              if (parsed.theme === "dark" || parsed.theme === "light") {
                theme = parsed.theme;
              }
            }
          } catch (e) {
            var cookieValue = document.cookie
              .split("; ")
              .find(function (row) {
                return row.startsWith("_th=");
              });
            if (cookieValue) {
              var value = cookieValue.split("=")[1];
              if (value === "dark" || value === "light") theme = value;
            }
          }
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.cookie =
            "_th=" + theme + "; path=/; max-age=31536000; SameSite=Lax";
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body class="flex flex-col min-h-screen m-0 p-0 font-sans" style="font-family: Inter, ui-sans-serif, system-ui, sans-serif">

  </body>
