<!doctype html>
<html lang="en" class="h-full" data-scroll-behavior="smooth">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Modern Markdown Viewer</title>
    <meta
      name="description"
      content="A premium markdown viewing experience"
    />
    <link rel="icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="MDViewer" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = "light";
          try {
            var settings = localStorage.getItem("mdviewer_settings");
            if (settings) {
              var parsed = JSON.parse(settings);
              if (parsed.theme === "dark" || parsed.theme === "light") {
                theme = parsed.theme;
              }
            }
          } catch (e) {
            var cookieValue = document.cookie
              .split("; ")
              .find(function (row) {
                return row.startsWith("_th=");
              });
            if (cookieValue) {
              var value = cookieValue.split("=")[1];
              if (value === "dark" || value === "light") theme = value;
            }
          }
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.cookie =
            "_th=" + theme + "; path=/; max-age=31536000; SameSite=Lax";
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body class="flex flex-col min-h-screen m-0 p-0 font-sans" style="font-family: Inter, ui-sans-serif, system-ui, sans-serif">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
